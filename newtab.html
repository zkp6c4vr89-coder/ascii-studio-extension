<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <style>
    :root { color-scheme: dark; --dim: rgba(232, 232, 238, 0.55); --mono: Menlo, "SF Mono", Consolas, monospace; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #e8e8ee; font-family: var(--mono); }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    .clock {
      position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
      text-shadow: 0 0 24px #000, 0 0 8px #000;
    }
    .clock .time { font-size: clamp(48px, 9vw, 128px); font-weight: 600; letter-spacing: 0.02em; }
    .clock .date { font-size: clamp(13px, 1.4vw, 18px); color: var(--dim); margin-top: 4px; }
    .bar {
      position: fixed; right: 14px; bottom: 12px; display: flex; gap: 8px;
      opacity: 0.35; transition: opacity 0.2s;
    }
    .bar:hover { opacity: 1; }
    .bar a, .bar button {
      font: 12px var(--mono); color: #e8e8ee; text-decoration: none; cursor: pointer;
      background: rgba(20, 20, 25, 0.8); border: 1px solid #26262e; border-radius: 8px; padding: 6px 10px;
    }
    .hide-clock .clock { display: none; }
  </style>
</head>
<body>
  <canvas id="out"></canvas>
  <div class="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
  <div class="bar">
    <button id="toggle-clock" title="Show or hide the clock">Clock</button>
    <button id="pause">Pause</button>
    <a href="studio.html" title="Change your wallpaper in ASCII Studio">Change wallpaper</a>
  </div>
  <script type="module" src="newtab.js"></script>
</body>
</html>
