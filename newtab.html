<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="icon" type="image/png" href="brand/icon-32.png">
  <link rel="stylesheet" href="customise.css">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #f4f3f8; font-family: var(--font); -webkit-font-smoothing: antialiased; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

    .bar { position: fixed; right: 16px; bottom: 14px; display: flex; gap: 8px; opacity: 0.55; transition: opacity 0.25s; }
    .bar:hover, .bar:focus-within { opacity: 1; }
    .bar a, .bar button {
      font: 590 13px var(--font); letter-spacing: -0.01em; text-decoration: none; cursor: pointer;
      border-radius: 999px; padding: 9px 15px;
      transition: transform 120ms ease-out, background-color 150ms;
    }
    .bar a:hover, .bar button:hover { background: rgba(255, 255, 255, 0.14); }
    .bar a:active, .bar button:active, .tile:active { transform: scale(0.96); }

    .hint {
      position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 10px);
      font: 500 14px var(--font); letter-spacing: -0.01em;
      padding: 10px 16px; border-radius: 999px; pointer-events: none;
      opacity: 0; transition: opacity 0.3s, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .hint.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---- the sheet: Wallpapers + Customise ---- */
    .sheet {
      position: fixed; right: 16px; bottom: 64px; width: min(380px, calc(100vw - 32px));
      max-height: calc(100vh - 90px); overflow-y: auto; overscroll-behavior: contain;
      padding: 14px; border-radius: 26px;
      transform-origin: 85% 100%;
      transform: scale(0.92) translateY(8px); opacity: 0; pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s;
      background: rgba(20, 18, 30, 0.5);
      scrollbar-width: thin;
    }
    .sheet[open] { transform: none; opacity: 1; pointer-events: auto; }
    .sheet header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
    .sheet .x { border-radius: 999px; width: 30px; height: 30px; font-size: 15px; cursor: pointer; padding: 0; flex: none; }
    .tiles { display: grid; gap: 8px; }
    .tile {
      display: grid; gap: 2px; text-align: left; cursor: pointer;
      padding: 11px 14px; border-radius: 16px; font-family: var(--font);
      transition: transform 120ms ease-out, background-color 150ms;
    }
    .tile strong { font: 600 15px var(--font); letter-spacing: -0.01em; }
    .tile span { font-size: 12.5px; color: var(--dim); }
    .tile.on { background: rgba(255, 106, 138, 0.32); }
    .sheet .make { display: block; margin: 10px 4px 2px; font: 500 13px var(--font); color: var(--dim); text-decoration: none; }
    .sheet .make:hover { color: #fff; }

    .tabs { flex: 1; }
    .tabs button { font-size: 14px; padding: 8px 10px; }

    .pane[hidden] { display: none; }

    .toast {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px);
      font: 500 14px var(--font); letter-spacing: -0.01em; padding: 7px 8px 7px 16px; border-radius: 999px;
    }
    .toast[hidden] { display: none; }
    .toast button { font: 590 13px var(--font); border-radius: 999px; padding: 6px 12px; cursor: pointer; flex: none; }
    .toast button:hover { background: rgba(255, 255, 255, 0.16); }

    @media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; } .clock.rainbow .time { animation: none; } }
    @media (prefers-reduced-transparency: reduce) {
      .glass, .liquid .glass { background: #1c1a26; -webkit-backdrop-filter: none; backdrop-filter: none; }
    }
  </style>
</head>
<body>
  <!-- Liquid glass: bends what's behind the glass (Chromium only; others get frosted glass) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.01" numOctaves="2" seed="11" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.5" result="map"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="36" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <canvas id="out"></canvas>
  <div class="clock" id="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
  <div class="hint glass" id="hint"></div>
  <div class="snap-line" id="snap-line" aria-live="polite"></div>
  <div class="toast glass" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button class="glass" id="toast-undo">Undo</button>
    <button class="glass" id="toast-keep">Keep it</button>
  </div>

  <section class="sheet glass" id="sheet" aria-label="Wallpapers and settings">
    <header>
      <div class="seg tabs" role="tablist">
        <button data-tab="wallpapers" class="on" role="tab">Wallpapers</button>
        <button data-tab="customise" role="tab">Customise</button>
      </div>
      <button class="x glass" id="sheet-close" aria-label="Close">✕</button>
    </header>

    <div class="pane" data-pane="wallpapers">
      <div class="tiles" id="tiles"></div>
      <a class="make" href="studio.html">Make your own from a photo or video →</a>
    </div>

    <div class="pane" data-pane="customise" hidden>
      <h3 class="group-title" id="scene-title">Scene</h3>
      <div class="opts" id="scene-opts"></div>
      <div id="festive-group" hidden>
        <h3 class="group-title">Festive</h3>
        <div class="opts" id="festive-opts"></div>
      </div>
      <h3 class="group-title">Clock &amp; date</h3>
      <div class="opts" id="clock-opts"></div>
      <div id="stones-group" hidden>
        <h3 class="group-title">Stones found</h3>
        <div class="opts" id="stones-opts"></div>
      </div>
    </div>
  </section>

  <div class="bar">
    <button class="glass" id="wallpapers">Wallpapers</button>
    <button class="glass" id="toggle-clock" title="Show or hide the clock">Clock</button>
    <button class="glass" id="pause">Pause</button>
  </div>
  <script type="module" src="newtab.js"></script>
</body>
</html>
